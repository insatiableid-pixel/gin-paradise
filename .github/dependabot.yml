version: 2
updates:
  - package-ecosystem: npm
    directory: /gin-galaxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        update-types:
          - minor
          - patch
        patterns:
          - "@vitejs/*"
          - "vite"
          - "vitest"
          - "typescript"
          - "eslint*"
          - "prettier"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
