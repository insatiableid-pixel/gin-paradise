name: Quality Loops

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 2"

permissions:
  contents: read

concurrency:
  group: quality-loops
  cancel-in-progress: false

jobs:
  quality-loops:
    name: Flake and Quality Signals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gin-galaxy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gin-galaxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repeat test suite for flake signal
        run: npm run test:flaky

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run quality:bundle

      - name: Dead code signal
        continue-on-error: true
        run: npm run quality:dead-code

      - name: Duplicate code signal
        continue-on-error: true
        run: npm run quality:duplicates

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-loop-reports
          path: gin-galaxy/reports
