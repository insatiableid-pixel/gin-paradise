name: Autonomous Readiness

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Objective to decompose into parallel agent work"
        required: false
        default: "Advance Gin Paradise readiness toward Level 5"
  schedule:
    - cron: "41 11 * * 3"

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-readiness
  cancel-in-progress: false

jobs:
  audit-and-plan:
    name: Audit and Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gin-galaxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gin-galaxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate readiness audit
        run: npm run quality:readiness

      - name: Decompose objective
        env:
          GOAL_OBJECTIVE: ${{ github.event.inputs.objective || 'Advance Gin Paradise readiness toward Level 5' }}
        run: npm run agent:decompose

      - name: Upload autonomous plan
        uses: actions/upload-artifact@v6
        with:
          name: autonomous-readiness
          path: |
            gin-galaxy/reports/readiness-audit.*
            gin-galaxy/reports/agent-plan.*

      - name: Upsert readiness issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const readiness = fs.readFileSync("gin-galaxy/reports/readiness-audit.md", "utf8");
            const plan = fs.readFileSync("gin-galaxy/reports/agent-plan.md", "utf8");
            const title = "Autonomous readiness improvement plan";
            const body = `${readiness}\n\n---\n\n${plan}`;
            const { owner, repo } = context.repo;
            for (const label of [
              { name: "readiness", color: "0E8A16", description: "Repository readiness and automation work" },
              { name: "automation", color: "1D76DB", description: "Generated or maintained by automation" },
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "readiness",
              per_page: 100,
            });
            const issue = existing.find((item) => item.title === title);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["readiness", "automation"],
              });
            }
