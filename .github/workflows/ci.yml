name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  gin-galaxy:
    name: Gin Galaxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gin-galaxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gin-galaxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
