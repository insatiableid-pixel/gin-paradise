name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gin-galaxy:
    name: Gin Galaxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gin-galaxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gin-galaxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:audit

      - name: Secret scan
        run: npm run security:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run quality:bundle

      - name: Readiness audit
        run: npm run quality:readiness

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: gin-galaxy/reports/readiness-audit.*

  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gin-galaxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gin-galaxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            gin-galaxy/playwright-report
            gin-galaxy/test-results
