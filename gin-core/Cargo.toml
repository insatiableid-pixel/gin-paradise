[package]
name = "gin-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Gin Rummy core engine: card sets, meld detection, deadwood computation"

[lib]
name = "gin_core"
crate-type = ["rlib"]

[features]
python = ["pyo3"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
